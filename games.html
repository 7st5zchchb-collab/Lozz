<!doctype html>
<html lang="hy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popular Games</title>

    <link
      rel="icon"
      type="image/png"
      href="8e534619-dec9-48f0-be28-0f3a3f448dde.png"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 15% 20%,
            rgba(0, 255, 255, 0.12),
            transparent 30%
          ),
          radial-gradient(
            circle at 85% 80%,
            rgba(0, 255, 128, 0.1),
            transparent 30%
          ),
          linear-gradient(135deg, #050505, #111111, #050505);
        background-attachment: fixed;
        background-size: cover;
        color: white;
        padding: 40px 20px;
      }

      h1 {
        text-align: center;
        color: white;
        font-size: 32px;
        margin-bottom: 40px;
        text-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
      }

      .games-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 30px;
        width: 95%;
        max-width: 1500px;
        margin: 0 auto;
      }

      .game-card {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 22px;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.6),
          0 0 30px rgba(0, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .game-card:hover {
        transform: translateY(-5px);
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.7),
          0 0 40px rgba(0, 255, 255, 0.2);
        border-color: #00ffff;
      }

      .game-img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      }

      .game-info {
        padding: 25px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        text-align: center;
      }

      .game-title {
        font-size: 22px;
        color: white;
        margin-bottom: 10px;
      }

      .game-date {
        font-size: 13px;
        color: #00ffff;
        margin-bottom: 15px;
        font-weight: bold;
      }

      .game-desc {
        font-size: 14px;
        color: #aaa;
        line-height: 1.5;
        margin-bottom: 25px;
      }

      .game-link {
        display: inline-block;
        width: 100%;
        padding: 13px;
        background: linear-gradient(90deg, #00ffff, #00ff80);
        border: none;
        border-radius: 25px;
        color: #000;
        font-weight: bold;
        font-size: 15px;
        text-decoration: none;
        cursor: pointer;
        transition: 0.3s;
        box-sizing: border-box;
      }

      .game-link:hover {
        background: linear-gradient(90deg, #00ff80, #00ffff);
        box-shadow: 0 8px 25px rgba(0, 255, 255, 0.45);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <h1>All Popular Games</h1>
    <div class="games-grid" id="games-container"></div>

        },
        {

      const container = document.getElementById("games-container");
      generalGames.forEach((game) => {
        container.innerHTML += `
                <div class="game-card">
                    <img src="https://steamstatic.com{game.id}/header.jpg" alt="${game.title}" class="game-img">
                    <div class="game-info">
                        <div>
                            <h3 class="game-title">${game.title}</h3>
                            <div class="game-date">📅 Դուրս է եկել՝ ${game.date}</div>
                            <p class="game-desc">${game.desc}</p>
                        </div>
                        <a href="https://steampowered.com{game.id}/" target="_blank" class="game-link">Դիտել Steam-ում</a>

                </div>`;

  </body>
</html>
